# Test/local environment configuration
repos:
  - name: prefect
    url: https://prefecthq.github.io/prefect-helm

apps:
  # Prefect Server (self-hosted with PostgreSQL)
  - name: prefect-server
    chart: prefect-server
    repoURL: https://prefecthq.github.io/prefect-helm
    targetRevision: "2026.2.5193506"
    namespace: prefect
    values: |
      server:
        basicAuth:
          enabled: false
        uiConfig:
          prefectUiApiUrl: http://localhost:4200/api
      postgresql:
        enabled: true
        auth:
          password: "aqueduct-dev-password"
        primary:
          persistence:
            enabled: true
            size: 5Gi

  # Prefect Worker (polls kubernetes-pool, creates Jobs)
  - name: prefect-worker
    chart: prefect-worker
    repoURL: https://prefecthq.github.io/prefect-helm
    targetRevision: "2026.2.5193506"
    namespace: prefect
    values: |
      worker:
        apiConfig: selfHostedServer
        config:
          workPool: kubernetes-pool
        selfHostedServerApiConfig:
          apiUrl: http://prefect-server.prefect.svc.cluster.local:4200/api
